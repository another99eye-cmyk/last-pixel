<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAST PIXEL</title>
<style>
:root{--bg:#05050c;--fg:#e8f3ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05050c;--fg:#e8f3ff}}
:root[data-theme="dark"]{--bg:#05050c;--fg:#e8f3ff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr,G,state='menu',best=0,muted=false,deadAt=0,joy=null,ac,wallet=0,skin=0,owned=[1,0,0,0,0,0],shopMsg='',pg='main',BT=[];
const SPD0=230,SPD_MAX=320,SH=[12,22,34],PMAX=260;
try{best=+localStorage.getItem('lp_best')||0}catch(e){}
try{wallet=+localStorage.getItem('lp_w')||0;owned=JSON.parse(localStorage.getItem('lp_o2'))||owned;skin=+localStorage.getItem('lp_s2')||0}catch(e){}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(G)relayout()}
function relayout(){
  const bw=Math.min(W-30,920),bh=Math.min(H-110,580),sx=bw/G.bw,sy=bh/G.bh,ncx=W/2,ncy=H/2+10;
  const mv=o=>{o.x=ncx+(o.x-G.ox)*sx;o.y=ncy+(o.y-G.oy)*sy};
  G.bw=bw;G.bh=bh;G.base.w*=sx;G.base.h*=sy;G.A.w*=sx;G.A.h*=sy;
  G.min={w:Math.max(220,bw*.4),h:Math.max(170,bh*.45)};
  [G.P,...G.en,...G.pk,...G.pt,...G.bl,...G.eb,...G.sw].forEach(mv);G.ox=ncx;G.oy=ncy;
  const R=rect();
  for(const o of [G.P,...G.en]){o.x=Math.max(R.l+7,Math.min(R.r-7,o.x));o.y=Math.max(R.t+7,Math.min(R.b-7,o.y))}
}
addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
function snd(f,d=.08,v=.03,type='square'){if(muted)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

/* ---------- input ---------- */
const K={};
addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='KeyM')muted=!muted;
  if(state=='pick'){const i={Digit1:0,Digit2:1,Digit3:2}[e.code];if(i!==undefined)choose(i)}
  else if(state=='play'){if(e.code=='Space'&&!e.repeat)useSkill()}
  else if(state=='menu'){if(pg=='main'){if(e.code=='Enter'||e.code=='Space')start();else if(e.code=='KeyH')pg='how';else if(e.code=='KeyS')pg='shop'}else if(e.code=='Escape'||e.code=='Backspace')pg='main'}
  else if(state=='over'){if(e.code=='Space'||e.code=='Enter')start();else if(e.code=='Escape')toMenu()}
  if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
cv.addEventListener('pointerdown',e=>{
  const x=e.offsetX,y=e.offsetY;
  if(x>W-110&&y>32&&y<58){muted=!muted;return}
  if(state=='pick'){const i=cardRects().findIndex(r=>x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h);if(i>=0)choose(i);return}
  if(state=='menu'||state=='over'){const b=BT.find(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h);if(b&&!(state=='over'&&performance.now()-deadAt<500))b.f();return}
  if(state!='play')return;
  if(skin>=1&&skin<=4&&Math.hypot(x-(W-50),y-(H-60))<46){useSkill();return}if(e.pointerType!='mouse'&&!joy){joy={id:e.pointerId,x:e.offsetX,y:e.offsetY,dx:0,dy:0};cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(joy&&joy.id==e.pointerId){joy.dx=e.offsetX-joy.x;joy.dy=e.offsetY-joy.y}});
const up=e=>{if(joy&&joy.id==e.pointerId)joy=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* ---------- game setup ---------- */
const TYPES=[{r:9,hp:1,v:72,c:'#ff4d6d'},{r:7,hp:1,v:150,c:'#ffb703'},{r:18,hp:6,v:40,c:'#c77dff'},{r:10,hp:2,v:55,c:'#4cc9f0'},{r:28,hp:1,v:34,c:'#ff006e'}];
function reset(){
  const bw=Math.min(W-30,920),bh=Math.min(H-110,580);
  G={t:0,wave:1,waveT:0,kills:0,shards:0,lvl:0,bw,bh,
    base:{w:bw,h:bh},min:{w:Math.max(220,bw*.4),h:Math.max(170,bh*.45)},A:{w:bw,h:bh},
    sq:0,shake:0,spawnT:1,fireT:0,toast:'WAVE 1',toastT:2,hurtT:0,nb:0,opts:[],sp:0,owed:0,warn:0,lastPick:0,boss:null,bk:0,ups:0,calm:0,sqw:0,sw:[],ex:{has:0},skT:0,shA:0,ph:null,rv:0,pn:0,cnt:{rate:0,multi:0},k0:Math.random()*3|0,ox:W/2,oy:H/2+10,
    P:{x:W/2,y:H/2+10,vx:0,vy:0,kx:0,ky:0,hp:3,mhp:3,dmg:1,mag:110,sh:0,inv:0,rate:.25,multi:1,spd:SPD0},
    en:[],bl:[],eb:[],pk:[],pt:[]};
}
reset();
function start(){if(state=='over'&&performance.now()-deadAt<700)return;reset();state='play';snd(440,.15,.04);snd(660,.2,.03)}
function rect(){const cx=W/2,cy=H/2+10;return{l:cx-G.A.w/2,r:cx+G.A.w/2,t:cy-G.A.h/2,b:cy+G.A.h/2}}
const rnd=(a,b)=>a+Math.random()*(b-a);
function burst(x,y,c,n=10,sp=160){for(let i=0;i<n&&G.pt.length<PMAX;i++){const a=rnd(0,6.28),s=rnd(.3,1)*sp;G.pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.3,.7),m:.7,c})}}
function pickType(){const r=Math.random(),w=G.wave;if(w>=4&&r<.1)return 2;if(w>=3&&r<.25)return 3;if(w>=2&&r<.45)return 1;return 0}
function spawn(n){
  const R=rect();
  for(let i=0;i<n;i++){
    const t=pickType(),T=TYPES[t];let x,y,k=0;
    do{const s=Math.random()*4|0;x=s<2?rnd(R.l+14,R.r-14):(s==2?R.l+14:R.r-14);y=s>=2?rnd(R.t+14,R.b-14):(s==0?R.t+14:R.b-14);k++}
    while(Math.hypot(x-G.P.x,y-G.P.y)<130&&k<8);
    G.en.push({x,y,t,r:T.r,hp:T.hp,v:T.v*(1+G.wave*.015),w:.7,cd:rnd(1,2.2),f:0,a:rnd(0,6)});
  }
}
function nextWave(){
  G.wave++;G.waveT=0;
  G.base.w=Math.max(G.min.w,G.base.w*.94);G.base.h=Math.max(G.min.h,G.base.h*.94);
  G.toast='WAVE '+G.wave;G.toastT=2;
  if(G.wave%4==0){G.base.w=Math.min(G.bw,G.base.w*1.08);G.base.h=Math.min(G.bh,G.base.h*1.08);G.toast+='  MORE ROOM'}
  if(G.wave%3==0&&G.wave%5){G.sqw=3;G.toast='SQUEEZE INCOMING';G.toastT=3;snd(120,.3,.05,'sawtooth')}
  if(G.wave%5==0)spawnBoss();else spawn(2+G.wave);snd(220,.2,.04,'triangle');
}
function hurt(){
  const P=G.P;if(P.inv>0)return;
  if(G.shA>0){P.inv=.5;G.shake=5;G.sw.push({x:P.x,y:P.y,r:10,l:.3,m:.3,c:SK[1].c});snd(420,.1,.04,'triangle');return}
  if(P.sh){P.sh=0;P.inv=1;G.shake=8;G.sw.push({x:P.x,y:P.y,r:10,l:.4,m:.4,c:'#4cc9f0'});snd(400,.15,.05,'triangle');return}
  P.hp--;P.inv=1.1;G.shake=16;G.hurtT=.4;if(P.hp>0&&G.ex.has)explode();snd(110,.3,.08,'sawtooth');burst(P.x,P.y,'#fff',18,240);
  if(P.hp<=0&&skin==5&&!G.rv)revive();else if(P.hp<=0){state='over';endRun();deadAt=performance.now();if(G.t>best){best=G.t;G.nb=1;try{localStorage.setItem('lp_best',best)}catch(e){}}}
}
function killEnemy(e){
  burst(e.x,e.y,TYPES[e.t].c,14,200);G.kills++;snd(300+Math.random()*200,.07,.03);
  if(e.boss){G.boss=null;G.bk++;G.calm=6;G.owed++;G.toast='BOSS DOWN';G.toastT=2.5;G.shake=20;burst(e.x,e.y,'#ff006e',50,380);G.sw.push({x:e.x,y:e.y,r:10,l:.6,m:.6,c:'#ff006e',big:1});G.eb=[];G.base.w=Math.min(G.bw,G.base.w*1.1);G.base.h=Math.min(G.bh,G.base.h*1.1);snd(80,.7,.09,'sawtooth')}
  const n=G.sp>=3?0:(e.t==2?4:1);for(let i=0;i<n;i++)G.pk.push({x:e.x+rnd(-8,8),y:e.y+rnd(-8,8),k:0,l:12});
  if(Math.random()<.05)G.pk.push({x:e.x,y:e.y,k:1,l:12});
}
const UP=[
 {id:'rate',n:'Rapid fire',d:'Shoot 20% faster',ok:P=>P.rate>.09,f:P=>P.rate=Math.max(.08,P.rate*.8)},
 {id:'multi',n:'Extra shot',d:'+1 bullet per volley (max 4)',ok:P=>P.multi<4,f:P=>P.multi++},
 {id:'spd',n:'Swift legs',d:'Move 8% faster (capped)',ok:P=>P.spd<SPD_MAX-1,f:P=>P.spd=Math.min(SPD_MAX,P.spd*1.08)},
 {id:'ex',n:'Explode Enemies',d:'One use: when you lose health, blast all enemies and get 4s of calm',ok:()=>!G.ex.has,f:()=>{G.ex.has=1}},
 {id:'dmg',n:'Heavy shot',d:'Bullets hit harder (+1 damage, max 3)',ok:P=>P.dmg<3,f:P=>P.dmg++},
 {id:'mag',n:'Magnet',d:'Pull shards and hearts from farther away',ok:P=>P.mag<260,f:P=>P.mag+=50},
 {id:'vit',n:'Vitality',d:'+1 max health and heal 1 (max 6)',ok:P=>P.mhp<6,f:P=>{P.mhp++;P.hp++}},
 {id:'sh',n:'Shield',d:'Absorbs the next hit, then breaks',ok:P=>!P.sh,f:P=>P.sh=1}
];
function openPick(){
  const av=UP.filter(u=>u.ok(G.P));for(let i=av.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[av[i],av[j]]=[av[j],av[i]]}
  const a=av.slice(0,3);
  if(G.pn<3){for(const id of['rate','multi']){const u=av.find(x=>x.id==id);if(!u||a.includes(u))continue;
    if(2-G.cnt[id]>=3-G.pn||Math.random()<.6){const k=a.findIndex(x=>x.id!='rate'&&x.id!='multi');if(k>=0)a[k]=u;else if(a.length<3)a.push(u)}}
    for(const u of a)if(u.id in G.cnt)G.cnt[u.id]++;G.pn++}
  if(!a.length){G.P.hp=Math.min(G.P.mhp,G.P.hp+1);return}
  G.opts=a;state='pick';snd(600,.1,.04,'triangle');
}
function choose(i){
  const u=G.opts[i];if(!u)return;u.f(G.P);
  G.toast=u.n.toUpperCase();G.toastT=2;G.P.inv=Math.max(G.P.inv,.6);G.lastPick=G.t;G.ups++;state='play';
  G.sw.push({x:G.P.x,y:G.P.y,r:8,l:.5,m:.5,c:'#7dffb2'});snd(700,.15,.04,'triangle');snd(900,.2,.03,'triangle');
}
function cardRects(){
  const n=G.opts.length,nar=W<560,gap=12,w=nar?W-40:Math.min(190,(W-40-gap*(n-1))/n),h=nar?78:165;
  const tw=nar?w:w*n+gap*(n-1),x0=(W-tw)/2,y0=nar?H/2-(h*n+gap*(n-1))/2+20:H/2-h/2+20;
  return G.opts.map((u,i)=>nar?{x:x0,y:y0+i*(h+gap),w,h}:{x:x0+i*(w+gap),y:y0,w,h});
}
function wrap(s,n){const o=[];let l='';for(const w of s.split(' ')){if((l+' '+w).trim().length>n){o.push(l);l=w}else l=(l+' '+w).trim()}o.push(l);return o}
function explode(){
  const X=G.ex;if(!X.has||state!='play')return;X.has=0;G.calm=4;G.toast='EMERGENCY BLAST';G.toastT=2;
  G.shake=14;snd(70,.4,.08,'sawtooth');
  G.sw.push({x:G.P.x,y:G.P.y,r:10,l:.45,m:.45,c:'#ffb703',big:1});
  for(const e of G.en){if(e.boss)continue;burst(e.x,e.y,TYPES[e.t].c,12,220);G.kills++;e.dead=1}
  G.en=G.en.filter(e=>!e.dead);G.eb=[];
}
function spawnBoss(){
  const R=rect(),hp=30+G.wave*3;
  const b={x:(R.l+R.r)/2,y:R.t+40,t:4,r:28,hp,mhp:hp,v:34,w:1.2,cd:2.5,f:0,a:0,boss:1,k:(G.k0+G.wave/5-1)%3};
  G.en.push(b);G.boss=b;G.toast='BOSS: '+BN[b.k];G.toastT=2.5;G.shake=14;snd(60,.6,.08,'sawtooth');
}
function bossAI(e,dt,ux,uy,d){
  const ph=e.hp<e.mhp*.5?2:1;if(ph==2&&!e.p2){e.p2=1;G.toast='BOSS ENRAGED';G.toastT=1.8;G.shake=10;snd(70,.5,.07,'sawtooth')}
  if(e.k==1)return jugg(e,dt,ux,uy,ph);if(e.k==2)return hive(e,dt,ux,uy,ph);
  if(d>170){e.x+=ux*e.v*ph*dt;e.y+=uy*e.v*ph*dt}
  if(e.cd>=.6&&e.cd-dt<.6)snd(300,.25,.04,'square');
  e.cd-=dt;
  if(e.cd<=0)bossAtk(e,ux,uy);
}
const IC={rate:'#ffb703',multi:'#39f5ff',spd:'#7dffb2',ex:'#ff6b3d',dmg:'#ff4d6d',mag:'#c77dff',vit:'#ff4d6d',sh:'#4cc9f0'};
function icon(id,x,y,s){
  const c=IC[id]||'#fff';ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.beginPath();ctx.arc(0,0,s*1.5,0,6.28);ctx.fill();
  ctx.fillStyle=c;ctx.strokeStyle=c;ctx.lineWidth=Math.max(2,s*.14);ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowBlur=12;ctx.shadowColor=c;
  ctx.beginPath();
  if(id=='rate'){for(let k=-1;k<=1;k++)ctx.fillRect(-s+Math.abs(k)*s*.5,k*s*.6-2,s*1.7-Math.abs(k)*s*.5,4)}
  else if(id=='multi'){for(const a of[-.6,0,.6]){ctx.moveTo(0,s*.9);ctx.lineTo(Math.sin(a)*s*1.5,s*.9-Math.cos(a)*s*1.8)}ctx.stroke()}
  else if(id=='spd'){ctx.moveTo(s*.3,-s);ctx.lineTo(-s*.5,s*.1);ctx.lineTo(0,s*.1);ctx.lineTo(-s*.3,s);ctx.lineTo(s*.5,-s*.1);ctx.lineTo(0,-s*.1);ctx.closePath();ctx.fill()}
  else if(id=='ex'){for(let i=0;i<8;i++){const a=i*.785;ctx.moveTo(Math.cos(a)*s*.45,Math.sin(a)*s*.45);ctx.lineTo(Math.cos(a)*s*1.05,Math.sin(a)*s*1.05)}ctx.stroke();ctx.beginPath();ctx.arc(0,0,s*.25,0,6.28);ctx.fill();}
  else if(id=='dmg'){ctx.fillRect(-s*.2,-s*.6,s*1.1,s*1.2);for(let k=-1;k<=1;k++){ctx.moveTo(-s*.4,k*s*.45);ctx.lineTo(-s*1.1,k*s*.45)}ctx.stroke()}
  else if(id=='mag'){ctx.lineWidth=s*.38;ctx.moveTo(-s*.7,s*.9);ctx.lineTo(-s*.7,-s*.1);ctx.arc(0,-s*.1,s*.7,Math.PI,0);ctx.lineTo(s*.7,s*.9);ctx.stroke()}
  else if(id=='vit'){ctx.moveTo(0,s*.9);ctx.bezierCurveTo(-s*1.4,0,-s*.8,-s,0,-s*.35);ctx.bezierCurveTo(s*.8,-s,s*1.4,0,0,s*.9);ctx.fill()}
  else if(id=='sh'){ctx.moveTo(0,-s);ctx.lineTo(s*.9,-s*.6);ctx.lineTo(s*.9,s*.1);ctx.quadraticCurveTo(s*.9,s*.8,0,s);ctx.quadraticCurveTo(-s*.9,s*.8,-s*.9,s*.1);ctx.lineTo(-s*.9,-s*.6);ctx.closePath();ctx.stroke()}
  ctx.restore();
}
const SK=[{n:'Classic',c:'#39f5ff',p:0,d:'No ability. Pure survival.'},{n:'Aegis',c:'#6fa8ff',p:7000,d:'Space: 20s shield (60s cooldown)'},{n:'Prospector',c:'#ffb703',p:10000,d:'+25% score. Space: upgrade pop-up (150s cooldown)'},{n:'Phantom',c:'#c77dff',p:15000,d:'Space: phantom ally, 3 lives, 20s (60s cooldown)'},{n:'Nova',c:'#ff6b3d',p:7000,d:'Space: blast all enemies (30s cooldown)'},{n:'Miracle',c:'#ff9eea',p:20000,d:'Revives you once on death'}],SKCD=[0,60,150,60,30];
const HOW=[['GOAL','Survive as long as you can. Your pixel fires automatically at the nearest enemy.','#39f5ff'],['CONTROLS','Move with WASD or arrows, or drag on a touchscreen. Pick upgrades with 1 2 3 or by tapping. M mutes.','#fff'],['ENEMIES','Red squares chase. Yellow darts blink, then charge. Purple heavies are slow and tough. Blue shooters keep distance and fire. Bosses arrive every 5th wave and come in different kinds.','#ff4d6d'],['UPGRADES','Green shards unlock a few early upgrades, and bosses reward more. Hearts restore health. Explode Enemies is a one-use emergency blast.','#7dffb2'],['ARENA','The arena shrinks each wave. Before a squeeze the border flashes and a dashed box shows the new size. It grows back afterwards.','#ff3d6e'],['SCORE','Time, kills and bosses earn score. Spend it in the shop on skins. Most have a power you trigger with Space or the on-screen button.','#ffb703']];
const BC=['#ff006e','#ff7b00','#80ed99'],BN=['SENTINEL','JUGGERNAUT','HIVE'];
function save(){try{localStorage.setItem('lp_w',wallet);localStorage.setItem('lp_o2',JSON.stringify(owned));localStorage.setItem('lp_s2',skin)}catch(e){}}
function score(){return Math.round((G.t*10+G.kills*5+G.bk*200)*(skin==2?1.25:1))}
function endRun(){G.score=score();wallet+=G.score;save()}
function toMenu(){reset();state='menu';pg='main';shopMsg=''}
function buy(i){const k=SK[i];if(owned[i]){skin=i;shopMsg='Equipped '+k.n}else if(wallet>=k.p){wallet-=k.p;owned[i]=1;skin=i;shopMsg='Bought '+k.n+'!';snd(800,.15,.04,'triangle')}else shopMsg='Need '+(k.p-wallet)+' more score';save()}
function btn(s,x,y,w,h,f,c='#39f5ff'){BT.push({x,y,w,h,f});ctx.fillStyle='rgba(20,22,40,.9)';ctx.fillRect(x,y,w,h);ctx.strokeStyle=c;ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);txt(s,x+w/2,y+h/2,15,c)}
function drawMenu(){
  const bw=Math.min(260,W-60),x=(W-bw)/2;
  ctx.fillStyle=pg=='main'?'rgba(5,5,12,.6)':'rgba(5,5,12,.94)';ctx.fillRect(0,0,W,H);
  if(pg=='main'){
    txt('LAST PIXEL',W/2,H/2-100,Math.min(60,W/8),'#fff');
    txt('The arena is shrinking. Survive.',W/2,H/2-62,14,'rgba(232,243,255,.7)');
    btn('PLAY',x,H/2-34,bw,46,start);btn('HOW TO PLAY',x,H/2+26,bw,46,()=>pg='how','#e8f3ff');btn('SHOP',x,H/2+86,bw,46,()=>{pg='shop';shopMsg=''},'#ffb703');
    txt('Score bank '+wallet+'   Best '+fmt(best),W/2,H/2+160,12,'rgba(232,243,255,.6)');
  }else if(pg=='how'){
    txt('HOW TO PLAY',W/2,32,22,'#fff');
    const cw=Math.min(560,W-44),lx=(W-cw)/2,n=Math.floor(cw/7.2);let y=62;
    for(const [h,s,c] of HOW){txt(h,lx,y,13,c,'left');y+=17;for(const l of wrap(s,n)){txt(l,lx,y,12,'rgba(232,243,255,.75)','left');y+=15}y+=8}
    btn('BACK',x,H-54,bw,42,()=>pg='main','#e8f3ff');
  }else{
    txt('SHOP',W/2,32,22,'#ffb703');txt('Score bank '+wallet,W/2,56,14,'#fff');
    const cw=Math.min(420,W-32),ch=Math.max(44,Math.min(64,(H-170)/SK.length-8)),cx=(W-cw)/2;
    SK.forEach((k,i)=>{const y=76+i*(ch+8),own=owned[i],eq=skin==i;
      BT.push({x:cx,y,w:cw,h:ch,f:()=>buy(i)});
      ctx.fillStyle='rgba(20,22,40,.9)';ctx.fillRect(cx,y,cw,ch);ctx.strokeStyle=eq?'#7dffb2':k.c;ctx.lineWidth=eq?3:1.5;ctx.strokeRect(cx,y,cw,ch);

/* ---------- update ---------- */
function update(dt){
  const P=G.P;G.t+=dt;if(!G.boss&&!(G.calm>0))G.waveT+=dt;if(G.skT>0)G.skT-=dt;if(G.shA>0)G.shA-=dt;if(G.hurtT>0)G.hurtT-=dt;
  if(G.sp<3&&G.shards>=SH[G.sp]&&G.t-G.lastPick>=25){G.shards=0;G.sp++;G.owed++}
  if(G.warn>0){G.warn-=dt;if(G.warn<=0){G.warn=0;openPick()}}
  else if(G.owed>0&&G.t-G.lastPick>=8){G.owed--;G.warn=2;snd(500,.12,.04,'triangle')}
  if(G.waveT>=12)nextWave();
  if(G.sqw>0){G.sqw-=dt;if(G.sqw<=0){G.sqw=0;G.sq=5;G.shake=10;snd(90,.5,.06,'sawtooth')}}
  if(G.sq>0){G.sq=Math.max(0,G.sq-dt);if(G.sq==0){G.base.w=Math.min(G.bw,G.base.w*1.15);G.base.h=Math.min(G.bh,G.base.h*1.15);G.toast='ROOM TO BREATHE';G.toastT=2}}
  let pulse=G.sq>0?Math.sin(Math.PI*(1-G.sq/5)):0;if(G.boss&&G.boss.k==2)pulse=Math.max(pulse,.5);
  const dp=sqd(),tw=G.base.w*(1-dp*pulse),th=G.base.h*(1-dp*pulse),k=Math.min(1,dt*2);
  G.A.w+=(tw-G.A.w)*k;G.A.h+=(th-G.A.h)*k;
  const R=rect();

  // movement
  let ix=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),iy=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0);
  if(joy){const m=Math.hypot(joy.dx,joy.dy);if(m>8){const s=Math.min(1,m/60);ix=joy.dx/m*s;iy=joy.dy/m*s}}
  const l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l}
  const a=1-Math.exp(-dt*20);
  P.vx+=(ix*P.spd-P.vx)*a;P.vy+=(iy*P.spd-P.vy)*a;const kd=Math.exp(-dt*9);P.kx*=kd;P.ky*=kd;
  let nx=P.x+(P.vx+P.kx)*dt;if(nx<R.l+7){nx=R.l+7;P.vx=Math.max(0,P.vx);P.kx=Math.max(0,P.kx)}else if(nx>R.r-7){nx=R.r-7;P.vx=Math.min(0,P.vx);P.kx=Math.min(0,P.kx)}P.x=nx;
  let ny=P.y+(P.vy+P.ky)*dt;if(ny<R.t+7){ny=R.t+7;P.vy=Math.max(0,P.vy);P.ky=Math.max(0,P.ky)}else if(ny>R.b-7){ny=R.b-7;P.vy=Math.min(0,P.vy);P.ky=Math.min(0,P.ky)}P.y=ny;if(Math.hypot(P.vx,P.vy)>60&&G.pt.length<PMAX)G.pt.push({x:P.x,y:P.y,vx:0,vy:0,l:.22,m:.22,c:SK[skin].c});
  if(P.inv>0)P.inv-=dt;

  // auto-fire at nearest enemy
  G.fireT-=dt;
  if(G.fireT<=0){
    let n=null,nd=1e9;

  if(joy){ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.x,joy.y,60,0,6.28);ctx.stroke();
    const m=Math.min(60,Math.hypot(joy.dx,joy.dy)),an=Math.atan2(joy.dy,joy.dx);
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(joy.x+Math.cos(an)*m,joy.y+Math.sin(an)*m,18,0,6.28);ctx.fill()}

  // HUD
  if(state!='menu'){
    txt(fmt(G.t),W/2,28,26,'#fff');
    txt('WAVE '+G.wave+'   KILLS '+G.kills,W/2,52,12,'rgba(232,243,255,.6)');
    for(let i=0;i<P.mhp;i++){ctx.fillStyle=i<P.hp?'#ff4d6d':'rgba(255,77,109,.2)';ctx.fillRect(16+i*18,18,12,12)}
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(16,38,90,4);ctx.fillStyle='#7dffb2';ctx.fillRect(16,38,(G.sp<3?90*Math.min(1,G.shards/SH[G.sp]):0),4);
    txt('BEST '+fmt(best),W-16,24,12,'rgba(232,243,255,.6)','right');
    if(G.boss){const bw=Math.min(320,W-40),bx0=(W-bw)/2;ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(bx0,66,bw,6);txt(BN[G.boss.k],W/2,81,10,BC[G.boss.k]);ctx.fillStyle=BC[G.boss.k];ctx.fillRect(bx0,66,bw*Math.max(0,G.boss.hp/G.boss.mhp),6)}
    if(G.warn>0){ctx.globalAlpha=.6+.4*Math.sin(performance.now()/90);txt('UPGRADE INCOMING '+Math.ceil(G.warn),W/2,92,16,'#7dffb2');ctx.globalAlpha=1}
    txt('SCORE '+score(),16,58,12,'rgba(232,243,255,.7)','left');if(G.ex.has){icon('ex',24,80,8);txt('BLAST ARMED',42,80,11,'#ff6b3d','left')}
    if(skin>=1&&skin<=4){const k=SK[skin],rdy=G.skT<=0,bx=W-50,by=H-60;
      ctx.fillStyle=rdy?'rgba(255,255,255,.1)':'rgba(255,255,255,.04)';ctx.beginPath();ctx.arc(bx,by,34,0,6.28);ctx.fill();
      ctx.strokeStyle=rdy?k.c:'rgba(255,255,255,.25)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(bx,by,34,0,6.28);ctx.stroke();
      if(!rdy){ctx.strokeStyle=k.c;ctx.beginPath();ctx.arc(bx,by,34,-1.57,-1.57+6.28*(1-G.skT/SKCD[skin]));ctx.stroke()}
      txt(rdy?'READY':Math.ceil(G.skT)+'s',bx,by,rdy?12:15,rdy?k.c:'#fff');txt('Space',bx,by+50,10,'rgba(232,243,255,.5)')}
      
      
      
    if(G.toastT>0){ctx.globalAlpha=Math.min(1,G.toastT);txt(G.toast,W/2,H-34,20,col);ctx.globalAlpha=1}
  }
  txt('SOUND '+(muted?'OFF':'ON')+' (M)',W-16,44,12,muted?'#ff4d6d':'rgba(232,243,255,.6)','right');
  if(state=='pick'){
    ctx.fillStyle='rgba(5,5,12,.78)';ctx.fillRect(0,0,W,H);
    const rs=cardRects();txt('CHOOSE AN UPGRADE',W/2,rs[0].y-34,20,'#fff');
    rs.forEach((r,i)=>{const u=G.opts[i];ctx.fillStyle='rgba(20,22,40,.95)';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle=col;ctx.lineWidth=2;ctx.strokeRect(r.x,r.y,r.w,r.h);
      const nr=r.h<100,ix=nr?r.x+38:r.x+r.w/2,iy=nr?r.y+r.h/2:r.y+38,tx=nr?r.x+r.w/2+34:r.x+r.w/2,ty=nr?r.y+22:r.y+80;icon(u.id,ix,iy,nr?15:22);txt((i+1)+'  '+u.n,tx,ty,14,'#fff');
      wrap(u.d,Math.floor((r.w-(nr?90:20))/7.3)).forEach((l,j)=>txt(l,tx,ty+22+j*16,12,'rgba(232,243,255,.7)'))});
  }
  // overlays
  if(state=='menu'){
    drawMenu();
    
    
    
  }
  if(state=='over'){
    ctx.fillStyle='rgba(5,5,12,.7)';ctx.fillRect(0,0,W,H);
    txt('PIXEL LOST',W/2,H/2-60,Math.min(48,W/9),'#ff4d6d');
    txt('Survival time '+fmt(G.t),W/2,H/2-12,18,'#fff');
    txt('Highest wave '+G.wave+'   Bosses '+G.bk,W/2,H/2+14,14,'rgba(232,243,255,.7)');txt('Defeated '+G.kills+'   Upgrades '+G.ups,W/2,H/2+36,14,'rgba(232,243,255,.7)');txt(G.nb?'NEW BEST TIME!':'Best time '+fmt(best),W/2,H/2+60,14,G.nb?'#7dffb2':'rgba(232,243,255,.7)');txt(G.bk>1?'Boss hunter. Strong run.':G.bk==1?'You took down a boss. Nice.':G.t>90?'Steady survival. Aim for a boss next.':'Every run teaches something. Go again.',W/2,H/2+84,12,'rgba(232,243,255,.5)');
    txt('Score +'+G.score+'   Bank '+wallet,W/2,H/2+106,14,'#ffb703');const bw2=Math.min(150,(W-50)/2);btn('RETRY',W/2-bw2-8,H/2+126,bw2,42,start,'#39f5ff');btn('MENU',W/2+8,H/2+126,bw2,42,toMenu,'#e8f3ff');
  }
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state=='play')update(dt);
  else if(state=='over'){for(const p of G.pt){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}G.pt=G.pt.filter(p=>p.l>0)}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
